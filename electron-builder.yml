appId: com.openjob.app
productName: OpenJob
# Avoid spaces in release filenames — some download tools / AV scanners mishandle them.
artifactName: '${productName}-Setup-${version}.${ext}'
directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json

# tree-sitter 的 .wasm 语法文件不参与打包，放在 resources 下按需读取；
# Drizzle 迁移必须随包分发，首次启动要靠它建表
extraResources:
  - from: resources
    to: .
    filter:
      - '**/*'
  - from: src/main/db/migrations
    to: migrations
    filter:
      - '**/*'

# 原生模块（better-sqlite3）的 .node 必须解包，asar 内无法 dlopen；
# onnxruntime-web 的 WASM/MJS 运行时文件也要解包——主进程通过 file:// 动态加载，
# 无法读取 asar 虚拟路径，SttService 会把 app.asar 改写为 app.asar.unpacked
asarUnpack:
  - '**/*.node'
  - '**/onnxruntime-web/dist/ort-wasm-simd-threaded.*'

# 让 electron-builder 按 Electron 的 ABI 重建原生依赖
npmRebuild: true

# electron-builder 在构建时直接把产物发布到 GitHub Release（provider: github）。
# releaseType: release —— 允许挂载到已发布的正式 release（默认 draft 模式会因
# "existing type not compatible" 跳过上传），且未来打新 tag 时自动创建正式 release 并附带安装包。
# latest.yml / latest-mac.yml 等更新清单仍会随包生成；运行时更新源由
# config.update.feedUrl 通过 setFeedURL 覆盖，因此不依赖这里固定的发布地址。
publish:
  - provider: github
    channel: latest
    releaseType: release

# 直接复用 devDependency 里已解压的 Electron，跳过「下载 → 解压 → 重命名」。
# Windows 上 Defender 会在解压后立刻扫描 electron.exe 与各 dll，持有句柄导致
# 目录重命名报 EPERM；复用现成目录可以绕开这个时间窗。
electronDist: node_modules/electron/dist

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.education
  # CI has no Developer ID cert. Ad-hoc signing prevents the misleading
  # "app is damaged" Gatekeeper error on Apple Silicon (unsigned builds are
  # rejected outright). Users still see the dismissable "unidentified developer"
  # prompt on first launch.
  identity: '-'
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # 语音口述走 getUserMedia，TCC 要求 Info.plist 声明用途描述，缺了会静默拒绝权限
  extendInfo:
    NSMicrophoneUsageDescription: 用于语音口述（本地离线语音转文字）

dmg:
  sign: false

linux:
  target:
    - AppImage
    - deb
  category: Education
