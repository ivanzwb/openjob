name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# electron-builder 需要向 GitHub Release 上传安装包产物
permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # release 必须先于三个 package job 存在，且只能有一个创建者。
  # 否则并行的 electron-builder 各自「查不到就创建」，同时 POST /releases，
  # 抢输的那个直接以 422 already_exists 失败，它那一份安装包就永远不会上传
  # （v0.6.21 的 macOS DMG 就是这么丢的）。release 先建好之后，三个 job 一律
  # 只会查到并上传，谁都不再创建。build-android.yml 那边等 release 就绪的重试
  # 也顺带变成几乎立即命中。
  prepare-release:
    name: Ensure GitHub Release exists
    runs-on: ubuntu-latest
    steps:
      - name: Create release if missing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          # 正式 release 而非 draft，与 electron-builder.yml 的 releaseType: release 保持一致，
          # 否则 electron-builder 会判定 existing type not compatible 而跳过上传
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          # 重跑时可能与别的 job 撞上，创建失败就再查一次：真的存在了才算通过
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "${TAG#v}" --notes "" \
            || gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

  # 插件包与基础包分开发布：插件是纯数据，不需要 electron-builder，也不该跟着三个平台各打一遍。
  # 单独一个 job 还让「插件包坏了」和「安装包坏了」互不牵连。
  package-plugins:
    name: Package plugins
    needs: prepare-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pack and sign plugin bundles
        env:
          # 没配这个 secret 时脚本用临时密钥并警告：产物能装，但用户要手动确认来源
          OPENJOB_PLUGIN_PRIVATE_KEY: ${{ secrets.OPENJOB_PLUGIN_PRIVATE_KEY }}
        run: node scripts/pack-plugins.mjs

      # 产出的包若验签不过，用户看到的会是「内容与签名不符」——一条指向「有人改了包」的
      # 线索，而真实原因是发布流程自己出的错。在这里拦住。
      - name: Verify bundles are installable
        run: node scripts/verify-plugin-bundles.mjs dist-plugins

      - name: Upload plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: openjob-plugins
          path: dist-plugins/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach plugin bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist-plugins/* --repo "$GITHUB_REPOSITORY" --clobber

  package:
    name: Package (${{ matrix.os }})
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # windows-latest 镜像已升级到 VS 18，pnpm 内置的 node-gyp v11.5 无法解析其版本号，
          # 导致 better-sqlite3 的 Electron 重编译找不到 Visual Studio —— 固定 VS 2022 镜像
          - os: windows-2022
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux

    env:
      # No Developer ID certificate in CI — mac.identity: '-' in electron-builder.yml
      # enables ad-hoc signing so Apple Silicon Gatekeeper does not report "damaged".
      CSC_IDENTITY_AUTO_DISCOVERY: false
      # electron-builder 上传 GitHub Release 时使用
      GH_TOKEN: ${{ github.token }}
      # 允许往"发布时间超过 2 小时"的既有 release 挂资产（否则补跑/重跑会被跳过上传）
      EP_GH_IGNORE_TIME: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Cache electron-builder toolchains (Windows)
        if: matrix.os == 'windows-2022'
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-builder-win-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-builder-win-

      - name: Cache electron-builder toolchains (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron-builder
          key: electron-builder-macos-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-builder-macos-

      - name: Cache electron-builder toolchains (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-linux-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: electron-builder-linux-

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            libsqlite3-dev \
            libfuse2 \
            rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair NSIS toolchain cache
        if: matrix.os == 'windows-2022'
        working-directory: desktop
        run: node scripts/ensure-nsis-cache.mjs

      # Electron 43 起 npm 包不再带 postinstall（package.json 的 scripts 已移除），
      # pnpm install / pnpm rebuild 都不会自动解出二进制；electron-builder.yml 的
      # electronDist: node_modules/electron/dist 依赖它存在。手动跑一次 install.js
      # 下载并解压（幂等，已存在则跳过）。electron 是 desktop 的 devDependency，
      # pnpm 只在 desktop/node_modules 下建软链，所以得在 desktop 里跑
      - name: Provision Electron binary
        working-directory: desktop
        run: node node_modules/electron/install.js

      # 从 tag 同步版本号：防止 tag 与版本号不一致时，安装包被发布到错误的 release
      # （例如打 v0.2.1 tag 但版本仍是 0.2.0，electron-builder 会按版本挂到 v0.2.0）。
      # 版本号的唯一来源是 desktop/package.json（工作区根的 package.json 没有 version）。
      # 同时用 mobile/scripts/sync-version.mjs 同步手机端（mobile/package.json + app.json +
      # versionCode），否则 core/src/version.test.ts 的双端版本一致性检查会失败。
      - name: Sync version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const { readFileSync, writeFileSync } = require('node:fs'); const f = 'desktop/package.json'; const p = JSON.parse(readFileSync(f, 'utf8')); const v = process.env.GITHUB_REF_NAME.replace(/^v/, ''); if (p.version !== v) { p.version = v; writeFileSync(f, JSON.stringify(p, null, 2) + '\n'); console.log('version synced to ' + v); } else { console.log('version already ' + v); }"
          cd mobile && node scripts/sync-version.mjs

      - name: Typecheck
        run: pnpm run typecheck

      # 显式传 --publish always（pnpm run dist -- args 会在脚本后多插一个 -- 导致参数丢失，
      # 且 electron-builder v27 起 CI 隐式发布将被移除，显式声明更稳健）
      # 这几步都在 desktop 里跑：脚本按 process.cwd() 找 dist/、package.json 和
      # node_modules/.bin/electron-builder，electron-builder.yml 的相对路径同理
      - name: Package installers
        working-directory: desktop
        run: pnpm run build && node scripts/run-electron-builder.mjs --publish always

      - name: Verify Windows installer
        if: matrix.os == 'windows-2022'
        working-directory: desktop
        run: node scripts/verify-windows-installer.mjs

      - name: Verify macOS app signature
        if: matrix.os == 'macos-latest'
        working-directory: desktop
        run: node scripts/verify-mac-app.mjs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openjob-${{ matrix.artifact }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.yml
            desktop/dist/*.blockmap
            desktop/dist/*.zip
          if-no-files-found: error
          retention-days: 30
