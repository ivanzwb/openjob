<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <style>
      /* 手机端宿主不注入应用主题，这里一律走中性兜底色（var 的兜底分支），
         深浅两套下都读得清；桌面端页面那份才取注入的 --color-… 变量。 */
      [hidden] { display: none !important; }
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
        padding: 14px;
        margin: 0;
        color: inherit;
        background: transparent;
        font-size: 15px;
        -webkit-text-size-adjust: 100%;
      }
      h2 { font-size: 16px; margin: 18px 0 8px; }
      h2:first-child { margin-top: 0; }
      ul { list-style: none; margin: 0; padding: 0; }
      p { margin: 0 0 8px; }
      button {
        font: inherit;
        min-height: 46px;
        padding: 12px 16px;
        border: 1px solid rgba(127, 127, 127, 0.35);
        border-radius: 10px;
        background: rgba(127, 127, 127, 0.18);
        color: inherit;
      }
      button:disabled { opacity: 0.45; }
      input {
        width: 100%;
        font-size: 15px;
        min-height: 46px;
        padding: 10px 12px;
        border: 1px solid rgba(127, 127, 127, 0.4);
        border-radius: 10px;
        background: transparent;
        color: inherit;
      }
      .muted { opacity: 0.65; font-size: 13px; }
      .hint { font-size: 13px; opacity: 0.75; line-height: 1.5; }
      .path { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; }
      .row-actions { display: flex; flex-direction: row; gap: 8px; flex-wrap: wrap; align-items: center; }

      /* 登记条目：卡片 + 元信息，点一下选中并进入详情 */
      #repos li { margin-bottom: 10px; }
      .repo-card {
        width: 100%;
        min-height: 0;
        text-align: left;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px;
        border-radius: 12px;
        background: transparent;
      }
      .repo-card.selected { border-color: rgba(79, 124, 255, 0.9); }
      .repo-card .name { font-size: 16px; font-weight: 600; word-break: break-all; }

      /* 页签：项目摘要 / 代码 / 问答 */
      .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0; }
      .tab {
        min-height: 40px;
        padding: 8px 14px;
        font-size: 14px;
        border-radius: 10px;
        color: inherit;
        opacity: 0.7;
      }
      .tab.active { background: rgba(79, 124, 255, 0.9); border-color: transparent; color: #fff; opacity: 1; }

      .card {
        border: 1px solid rgba(127, 127, 127, 0.35);
        border-radius: 12px;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .entries li { display: flex; align-items: baseline; gap: 8px; padding: 10px 12px; font-size: 14px; }
      .entries .name { cursor: pointer; word-break: break-all; }
      .entries .size { margin-left: auto; }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
        font-size: 12px; line-height: 1.5; white-space: pre; overflow: auto;
        max-height: 45vh; margin: 0; padding: 8px;
        border: 1px solid rgba(127, 127, 127, 0.35); border-radius: 10px;
        background: rgba(127, 127, 127, 0.08);
      }
      .answer { white-space: pre-wrap; font-size: 14px; line-height: 1.5; margin: 8px 0 0; }
      .source { font-size: 12px; opacity: 0.75; margin: 2px 0; }
      #history { display: flex; flex-direction: column; gap: 10px; }
    </style>
  </head>
  <body>
    <h2>源码仓库</h2>
    <p id="offline" class="muted" hidden></p>
    <div class="row-actions">
      <button id="refresh">刷新</button>
      <span id="msg" class="muted"></span>
    </div>
    <p class="hint">
      手机端只读本包声明的数据集合：链接、更新与建索引都在桌面端做。下面的文件浏览与提问读的是
      「已配对桌面端的检出」——桌面按本包声明的 filesystem:workspace 解析出本包工作区，范围与桌面
      自己的页面完全一致。桌面不可达时这里如实说明，不会留一排点了必然失败的按钮。
    </p>
    <ul id="repos"></ul>

    <div id="detail" hidden>
      <div class="tabs">
        <button id="tab-summary" class="tab active" type="button">项目摘要</button>
        <button id="tab-files" class="tab" type="button">代码</button>
        <button id="tab-qa" class="tab" type="button">问答</button>
      </div>

      <div id="pane-summary" class="card"></div>

      <div id="pane-files" class="card" hidden>
        <div class="row-actions">
          <button id="up" disabled>上级</button>
          <span id="cwd" class="path muted">选中仓库后可浏览</span>
        </div>
        <ul id="entries" class="entries"></ul>
        <div class="row-actions">
          <span id="file-label" class="path muted">未打开文件</span>
          <span id="range" class="muted"></span>
        </div>
        <div class="row-actions">
          <button id="prev" disabled>上一页</button>
          <button id="next" disabled>下一页</button>
        </div>
        <pre id="code" class="code">选中仓库后，从上面的列表打开文件。</pre>
      </div>

      <div id="pane-qa" class="card" hidden>
        <p class="hint">
          问答由宿主的基础 Agent 编排，上下文由本页自己拼（问的是配对桌面端的这份检出）。回答经宿主
          事件流逐段回来，与桌面端页面同一条路径。
        </p>
        <input id="question" placeholder="如：登录流程在哪实现？" />
        <div class="row-actions">
          <button id="ask">提问</button>
        </div>
        <pre id="answer" class="answer muted" style="min-height: 40px"></pre>
        <div id="sources"></div>
      </div>
    </div>

    <script>
      // 受控桥：只放行本包声明过的方法（见 mobile/main.ts）。手机端只有读侧：数据集合读、
      // 工作区读、基础问答。写侧（workspace.* 的写 / artifact / 数据写入）本端没有，
      // 声明了也如实拒绝，所以这里不摆写按钮。
      function call(method, params) {
        return new Promise((resolve, reject) => {
          const reqId = Date.now() + Math.random();
          const onReply = (event) => {
            const reply = event.data && event.data.openjobResponse;
            if (reply && reply.reqId === reqId) {
              window.removeEventListener('message', onReply);
              reply.error ? reject(new Error(reply.error)) : resolve(reply.result);
            }
          };
          window.addEventListener('message', onReply);
          window.parent.postMessage({ openjob: { reqId, method, params } }, '*');
        });
      }

      // 登记表与桌面端同一份数据集合：行是包自己序列化的 JSON，宿主不理解内容。
      const COLLECTION = 'repositories';
      // 索引产物（摘要 / 仓库地图）：桌面建好随数据集合同步过来，手机端只读展示。
      const INDEX_COLLECTION = 'repository-indexes';
      // 一页读多少行：大文件翻页看，不整份塞进页面（宿主单次读有字节上限，超了如实报错）。
      const PAGE_LINES = 200;
      const CODE_HINT = '选中仓库后，从上面的列表打开文件。';

      let repos = [];
      let indexByKey = new Map(); // 检出目录 → 索引行（只读展示）
      let selected = null;
      let activeTab = 'summary';
      let reachable = true;
      let browseDir = null;   // 当前浏览目录（工作区相对路径）
      let openPath = null;    // 当前打开的文件（工作区相对路径）
      let pageOffset = 1;     // 当前页起始行（1 起）
      let pageHasMore = false;
      let answerStreamId = null;
      let answerPending = false; // 已发起提问、还没收到收尾事件；用于容忍事件早到

      function setMsg(text) {
        document.getElementById('msg').textContent = text;
      }

      /** 桌面不可达：如实说明，并把依赖配对桌面的按钮停掉，而不是让它们点了必然失败。 */
      function markOffline(error) {
        reachable = false;
        const hint = document.getElementById('offline');
        hint.hidden = false;
        hint.textContent = `桌面端不可达：${error && error.message ? error.message : String(error)}。`;
        for (const id of ['up', 'prev', 'next', 'ask']) {
          document.getElementById(id).disabled = true;
        }
      }

      function formatSize(bytes) {
        if (!bytes) return '';
        return bytes > 1024 * 1024
          ? `${(bytes / 1024 / 1024).toFixed(1)} MB`
          : `${Math.round(bytes / 1024)} KB`;
      }

      function parseEntry(raw) {
        if (typeof raw !== 'string' || !raw) return null;
        let value;
        try {
          value = JSON.parse(raw);
        } catch {
          return null;
        }
        if (!value || typeof value !== 'object' || Array.isArray(value)) return null;
        const id = typeof value.id === 'string' && value.id ? value.id : null;
        if (!id) return null;
        const label = typeof value.label === 'string' && value.label ? value.label : id;
        return {
          id,
          label,
          url: typeof value.url === 'string' && value.url ? value.url : label,
          ready: value.ready === true,
          dir: typeof value.dir === 'string' && value.dir ? value.dir : id,
          branch: typeof value.branch === 'string' ? value.branch : null,
          commit: typeof value.commit === 'string' ? value.commit : null,
          fileCount: typeof value.fileCount === 'number' ? value.fileCount : null,
          bytes: typeof value.bytes === 'number' ? value.bytes : null,
          fetchedAt: typeof value.fetchedAt === 'number' ? value.fetchedAt : null,
        };
      }

      /** 索引行：只认得出状态的才是可用行；手机端只读，不认识的内容一概当没有。 */
      function parseIndex(raw) {
        if (typeof raw !== 'string' || !raw) return null;
        let value;
        try {
          value = JSON.parse(raw);
        } catch {
          return null;
        }
        if (!value || typeof value !== 'object' || Array.isArray(value)) return null;
        if (typeof value.status !== 'string') return null;
        return {
          status: value.status,
          summary: typeof value.summary === 'string' ? value.summary : '',
          repoMap: typeof value.repoMap === 'string' ? value.repoMap : '',
          note: typeof value.note === 'string' ? value.note : '',
          builtAt: typeof value.builtAt === 'number' ? value.builtAt : null,
        };
      }

      function currentRepo() {
        return repos.find((item) => item.id === selected) || null;
      }

      /** 切页签：只切详情里的三块面板，登记表不动。 */
      function setTab(name) {
        activeTab = name;
        const panes = { summary: 'pane-summary', files: 'pane-files', qa: 'pane-qa' };
        const tabs = { summary: 'tab-summary', files: 'tab-files', qa: 'tab-qa' };
        for (const key of Object.keys(panes)) {
          document.getElementById(tabs[key]).classList.toggle('active', key === name);
          document.getElementById(panes[key]).hidden = key !== name;
        }
      }

      /** 选中态与详情显隐：有选中仓库才展示详情。 */
      function renderSelection() {
        document.getElementById('detail').hidden = !currentRepo();
      }

      async function refresh() {
        const rows = await call('data.list', { collection: COLLECTION, limit: 1000 });
        repos = rows.map((row) => parseEntry(row.value)).filter(Boolean);
        // 索引产物与登记表同一份同步数据：桌面建好，手机端只读展示
        const indexRows = await call('data.list', { collection: INDEX_COLLECTION, limit: 1000 });
        indexByKey = new Map(indexRows.map((row) => [row.key, parseIndex(row.value)]));
        if (!repos.some((item) => item.id === selected)) selected = repos[0] ? repos[0].id : null;
        setMsg(repos.length ? '' : '还没有仓库：请在桌面端链接一个');
        renderRepos();
        renderSelection();
        renderSummary();
        // 预先把浏览位置放到选中检出的根目录，切到「代码」页签就能直接看；
        // 迁移过来的登记行还没有本机检出（commit 为空），不假装能浏览
        const repo = currentRepo();
        if (repo && repo.dir && repo.commit) await showDir(repo.dir);
      }

      function renderRepos() {
        const node = document.getElementById('repos');
        node.innerHTML = '';
        for (const entry of repos) {
          const li = document.createElement('li');

          // 卡片即「选中并看摘要」：点一下选中这个检出，详情里按页签浏览
          const card = document.createElement('button');
          card.type = 'button';
          card.className = entry.id === selected ? 'repo-card selected' : 'repo-card';

          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = entry.label;

          const meta = document.createElement('span');
          meta.className = 'muted';
          const when = entry.fetchedAt ? new Date(entry.fetchedAt).toLocaleString() : '';
          meta.textContent = entry.commit
            ? `${entry.branch || 'detached'}@${entry.commit.slice(0, 7)} · ${entry.fileCount ?? 0} 文件` +
              `${entry.bytes ? ' · ' + formatSize(entry.bytes) : ''}${when ? ' · ' + when : ''}`
            : // 桌面还没拉下来（或本机不共享检出目录）：只如实说登记过
              (entry.ready ? '已在桌面登记' : '尚未就绪');

          const actions = document.createElement('span');
          actions.className = 'muted';
          actions.textContent = currentRepo() === entry ? '已选中' : '点选查看';

          card.append(name, meta, actions);
          card.onclick = () => run(async () => {
            selected = entry.id;
            resetViewer();
            renderRepos();
            renderSelection();
            renderSummary();
            setTab('summary');
            const repo = currentRepo();
            if (repo && repo.dir && repo.commit) await showDir(repo.dir);
          });

          li.appendChild(card);
          node.appendChild(li);
        }
      }

      // ── 项目摘要：只读展示桌面同步过来的索引产物 ───────────────────────────
      function renderSummary() {
        const node = document.getElementById('pane-summary');
        node.innerHTML = '';
        const repo = currentRepo();
        if (!repo) return;
        const index = indexByKey.get(repo.id) || null;
        if (!index || index.status === 'building' || index.status === 'failed') {
          const hint = document.createElement('p');
          hint.className = 'muted';
          hint.textContent = repo.ready
            ? '暂无项目摘要，请在桌面端点「重建索引」后同步。'
            : '尚未同步到摘要与仓库地图。';
          node.appendChild(hint);
          return;
        }
        if (index.status === 'empty') {
          const hint = document.createElement('p');
          hint.className = 'muted';
          hint.textContent = index.note || '没什么可索引的';
          node.appendChild(hint);
          return;
        }
        const when = index.builtAt ? `（${new Date(index.builtAt).toLocaleString()} 建立）` : '';
        if (index.summary) {
          const summary = document.createElement('pre');
          summary.className = 'answer';
          summary.style.margin = '0';
          summary.textContent = index.summary;
          node.appendChild(summary);
        }
        if (index.repoMap) {
          const label = document.createElement('p');
          label.className = 'muted';
          label.textContent = '仓库地图';
          const map = document.createElement('pre');
          map.className = 'answer';
          map.style.margin = '0';
          map.textContent = index.repoMap;
          node.appendChild(label);
          node.appendChild(map);
        }
        if (when) {
          const at = document.createElement('p');
          at.className = 'muted';
          at.textContent = `建立于 ${new Date(index.builtAt).toLocaleString()}`;
          node.appendChild(at);
        }
      }

      // ── 只读浏览 / 带行号读取（读的是配对桌面端的检出） ─────────────────────
      async function showDir(dir) {
        const that = currentRepo();
        if (!that) throw new Error('先选中一个仓库');
        const entries = await call('workspace.list', { path: dir });
        browseDir = dir;
        document.getElementById('cwd').textContent = dir === '.' ? './' : dir + '/';
        // 不越出选中的检出：到了仓库根就没有「上级」
        document.getElementById('up').disabled = dir === that.dir;
        renderEntries(entries);
      }

      function renderEntries(entries) {
        const node = document.getElementById('entries');
        node.innerHTML = '';
        const sorted = [...entries].sort((left, right) => {
          if (left.type !== right.type) return left.type === 'dir' ? -1 : 1;
          return left.path < right.path ? -1 : left.path > right.path ? 1 : 0;
        });
        for (const entry of sorted) {
          const li = document.createElement('li');
          const base = entry.path.slice(entry.path.lastIndexOf('/') + 1);

          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = entry.type === 'dir' ? base + '/' : base;
          name.onclick = () =>
            run(() => (entry.type === 'dir' ? showDir(entry.path) : openFile(entry.path)));

          const meta = document.createElement('span');
          meta.className = 'muted size';
          meta.textContent = entry.type === 'dir' ? '' : formatSize(entry.size);

          li.append(name, meta);
          node.appendChild(li);
        }
        if (sorted.length === 0) {
          const li = document.createElement('li');
          li.className = 'muted';
          li.textContent = '（空目录）';
          node.appendChild(li);
        }
      }

      /** 读一页；多读一行用来判断后面还有没有内容。 */
      async function readRange(path, offset) {
        const text = await call('workspace.read', {
          path,
          startLine: offset,
          endLine: offset + PAGE_LINES,
        });
        const all = String(text === undefined || text === null ? '' : text).split('\n');
        const hasMore = all.length > PAGE_LINES;
        return { lines: hasMore ? all.slice(0, PAGE_LINES) : all, hasMore };
      }

      function renderLines(lines, start) {
        const rows = lines.map((line, index) => {
          const number = start + index;
          return `${number}\t${line}`;
        });
        document.getElementById('code').textContent = rows.join('\n');
      }

      function updateViewerChrome(lines) {
        document.getElementById('file-label').textContent = openPath || '未打开文件';
        const count = lines.length;
        const end = count > 0 ? pageOffset + count - 1 : pageOffset;
        document.getElementById('range').textContent = count > 0 ? `第 ${pageOffset}–${end} 行` : '';
        document.getElementById('prev').disabled = pageOffset <= 1;
        document.getElementById('next').disabled = !pageHasMore;
      }

      function resetViewer() {
        openPath = null;
        pageOffset = 1;
        pageHasMore = false;
        document.getElementById('code').textContent = CODE_HINT;
        document.getElementById('file-label').textContent = '未打开文件';
        document.getElementById('range').textContent = '';
        document.getElementById('prev').disabled = true;
        document.getElementById('next').disabled = true;
      }

      async function openFile(path) {
        const page = await readRange(path, 1);
        openPath = path;
        pageOffset = 1;
        pageHasMore = page.hasMore;
        renderLines(page.lines, 1);
        updateViewerChrome(page.lines);
      }

      async function gotoPage(offset) {
        if (!openPath) return;
        const page = await readRange(openPath, offset);
        pageOffset = offset;
        pageHasMore = page.hasMore;
        renderLines(page.lines, offset);
        updateViewerChrome(page.lines);
      }

      // ── 问源码：agent.ask + 宿主事件流（openjobEvent），与桌面端同一路径 ─────
      function renderSources(citations) {
        const node = document.getElementById('sources');
        node.innerHTML = '';
        if (!citations || citations.length === 0) return;
        const title = document.createElement('div');
        title.className = 'muted';
        title.textContent = '来源：';
        node.appendChild(title);
        for (const citation of citations) {
          const row = document.createElement('div');
          row.className = 'source';
          row.textContent = ('- ' + (citation.filePath || citation.title || citation.url || '')).trim();
          node.appendChild(row);
        }
      }

      async function ask() {
        const question = document.getElementById('question').value.trim();
        if (!question) return;
        const repo = currentRepo();
        if (!repo) throw new Error('先选中一个仓库再提问');
        const answer = document.getElementById('answer');
        document.getElementById('sources').innerHTML = '';
        answer.textContent = '正在问配对桌面端…';
        answerPending = true;
        answerStreamId = null;
        const started = await call('agent.ask', { question, role: 'codeAgent', allowTools: false });
        answerStreamId = started && started.streamId ? started.streamId : null;
        answerPending = false;
      }

      window.addEventListener('message', (event) => {
        const payload = event.data && event.data.openjobEvent;
        if (!payload) return;
        // 只处理这次提问的事件：桌面回传的 streamId 可能晚于事件到达（见 RN 侧转发顺序），
        // 所以在拿到 streamId 前按「正在提问」放行，拿到之后按 streamId 精确过滤。
        if (answerStreamId && payload.streamId && payload.streamId !== answerStreamId) return;
        if (!answerStreamId && !answerPending) return;
        const answer = document.getElementById('answer');
        if (payload.event === 'stream:delta') {
          // 第一段增量到达时清掉占位文案
          if (answer.textContent.indexOf('正在问') === 0) answer.textContent = '';
          answer.textContent += payload.delta || '';
        } else if (payload.event === 'stream:done') {
          if (payload.contentMd) answer.textContent = payload.contentMd;
          renderSources(payload.citations || []);
          answerStreamId = null;
          answerPending = false;
        } else if (payload.event === 'stream:error') {
          answer.textContent = `[错误] ${payload.message || ''}`;
          answerStreamId = null;
          answerPending = false;
        }
      });

      async function run(action) {
        try {
          await action();
        } catch (error) {
          setMsg(error && error.message ? error.message : String(error));
        }
      }

      document.getElementById('tab-summary').onclick = () => setTab('summary');
      document.getElementById('tab-files').onclick = () => setTab('files');
      document.getElementById('tab-qa').onclick = () => setTab('qa');

      document.getElementById('refresh').onclick = () =>
        run(async () => {
          await refresh();
          setMsg('已刷新');
        });

      document.getElementById('up').onclick = () =>
        run(async () => {
          const repo = currentRepo();
          if (!browseDir || !repo || browseDir === repo.dir) return;
          const cut = browseDir.lastIndexOf('/');
          await showDir(cut === -1 ? repo.dir : browseDir.slice(0, cut));
        });

      document.getElementById('prev').onclick = () =>
        run(() => gotoPage(Math.max(1, pageOffset - PAGE_LINES)));
      document.getElementById('next').onclick = () => run(() => gotoPage(pageOffset + PAGE_LINES));
      document.getElementById('ask').onclick = () => run(ask);

      void run(async () => {
        try {
          await refresh();
        } catch (error) {
          markOffline(error);
        }
      });
    </script>
  </body>
</html>
