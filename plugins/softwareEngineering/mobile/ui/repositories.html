<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        padding: 14px;
        margin: 0;
        color: inherit;
        background: transparent;
        font-size: 15px;
        -webkit-text-size-adjust: 100%;
      }
      h2 { font-size: 16px; margin: 18px 0 8px; }
      h2:first-child { margin-top: 0; }
      ul { list-style: none; margin: 0; padding: 0; }
      li {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 12px;
        margin-bottom: 10px;
        border: 1px solid rgba(127, 127, 127, 0.35);
        border-radius: 12px;
      }
      .name { font-size: 16px; font-weight: 600; }
      .muted { opacity: 0.65; font-size: 13px; }
      button {
        font-size: 15px;
        min-height: 46px;
        padding: 12px 16px;
        border: 0;
        border-radius: 10px;
        background: rgba(127, 127, 127, 0.25);
        color: inherit;
      }
      .hint { font-size: 13px; opacity: 0.75; line-height: 1.5; }
    </style>
  </head>
  <body>
    <h2>仓库</h2>
    <ul id="repos"></ul>
    <button id="refresh">刷新</button>
    <p id="msg" class="muted"></p>
    <p class="hint">
      手机端只看已经拉下来的仓库：链接、更新、概览与问源码都在桌面端做——工作区与远端拉取这两类原语
      只有桌面有，这里不摆一个点了必然失败的按钮。
    </p>

    <script>
      // 受控桥：只放行本包声明过的方法（见 mobile/main.ts）。手机端只声明了本包私有存储，
      // 它两端共用一份，所以桌面上拉下来的仓库在这里看得到。
      function call(method, params) {
        return new Promise((resolve, reject) => {
          const reqId = Date.now() + Math.random();
          const onReply = (event) => {
            const reply = event.data && event.data.openjobResponse;
            if (reply && reply.reqId === reqId) {
              window.removeEventListener('message', onReply);
              reply.error ? reject(new Error(reply.error)) : resolve(reply.result);
            }
          };
          window.addEventListener('message', onReply);
          window.parent.postMessage({ openjob: { reqId, method, params } }, '*');
        });
      }

      const STORAGE_KEY = 'repositories';

      function setMsg(text) {
        document.getElementById('msg').textContent = text;
      }

      function formatSize(bytes) {
        if (!bytes) return '';
        return bytes > 1024 * 1024
          ? `${(bytes / 1024 / 1024).toFixed(1)} MB`
          : `${Math.round(bytes / 1024)} KB`;
      }

      async function refresh() {
        const raw = await call('storage.get', { key: STORAGE_KEY });
        const repos = raw ? JSON.parse(raw) : [];
        const node = document.getElementById('repos');
        node.innerHTML = '';
        setMsg(repos.length ? '' : '还没有仓库：请在桌面端链接一个');

        for (const entry of repos) {
          const li = document.createElement('li');

          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = entry.dir;

          const meta = document.createElement('span');
          meta.className = 'muted';
          const when = new Date(entry.fetchedAt).toLocaleString();
          meta.textContent =
            `${entry.branch || 'detached'}@${entry.commit.slice(0, 7)} · ${entry.fileCount} 文件` +
            `${entry.bytes ? ' · ' + formatSize(entry.bytes) : ''} · ${when}`;

          const url = document.createElement('span');
          url.className = 'muted';
          url.textContent = entry.url;

          li.append(name, meta, url);
          node.appendChild(li);
        }
      }

      document.getElementById('refresh').onclick = () => {
        refresh().catch((error) => setMsg(error.message));
      };

      void refresh();
    </script>
  </body>
</html>
