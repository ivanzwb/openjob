<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; padding: 16px; color: inherit; background: transparent; }
      h2 { font-size: 14px; margin: 14px 0 6px; }
      ul { margin: 0; padding-left: 0; list-style: none; }
      li { margin: 4px 0; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
      .name { font-weight: 600; cursor: pointer; }
      .selected { font-weight: 700; text-decoration: underline; }
      .muted { opacity: 0.65; }
      button { font-size: 12px; }
      input { width: 60%; font-size: 13px; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h2>仓库</h2>
    <p>
      <input id="url" placeholder="https://github.com/org/repo.git" />
      <button id="link">链接仓库</button>
      <span id="msg" class="muted"></span>
    </p>
    <p class="muted" style="font-size: 12px">
      仓库拉进本包自己的工作区（只放行公开的 https 地址，深度 1、不带凭据）；重复链接同一地址即为更新。
      登记表存在本包声明的 repositories 数据集合里，桌面端是唯一写入方。
    </p>
    <ul id="repos"></ul>

    <h2>概览</h2>
    <pre id="overview" class="muted">选中仓库后点「概览」</pre>

    <h2>问源码</h2>
    <p>
      <input id="question" placeholder="选中仓库后提问，如：登录流程在哪实现？" />
      <button id="ask">提问</button>
    </p>
    <pre id="answer" class="muted" style="min-height: 40px"></pre>

    <script>
      // 受控桥：只能调本包声明过的方法（见 desktop/main.ts），未声明的调用落到「未开放的桥方法」。
      // 工作区的路径约束与容量上限判定全在宿主主进程，页面这里只传相对路径。
      function call(method, params) {
        return new Promise((resolve, reject) => {
          const reqId = Date.now() + Math.random();
          const onReply = (event) => {
            const reply = event.data && event.data.openjobResponse;
            if (reply && reply.reqId === reqId) {
              window.removeEventListener('message', onReply);
              reply.error ? reject(new Error(reply.error)) : resolve(reply.result);
            }
          };
          window.addEventListener('message', onReply);
          window.parent.postMessage({ openjob: { reqId, method, params } }, '*');
        });
      }

      // 登记表放在本包 manifest 声明的 repositories 数据集合里：宿主按 (集合, 键) 原样归档与
      // 同步，看不懂内容。行是这里自己序列化的 JSON 字符串，键取仓库 id——排程挑材料时按
      // {id, label, ready} 三个字段读，所以这三个字段必须写对（label 给展示，ready 才行）。
      const COLLECTION = 'repositories';
      const SOURCE_EXTENSIONS = /\.(c|cc|cpp|cs|go|h|hpp|java|js|jsx|kt|php|py|rb|rs|scala|swift|ts|tsx|vue)$/i;

      let repos = [];
      let selected = null;
      let answerStreamId = null;

      const msg = (text) => { document.getElementById('msg').textContent = text; };

      /** 行是包自己的 JSON，宿主不理解：解析不出、没有 id 的行一律跳过。 */
      function parseEntry(raw) {
        if (typeof raw !== 'string' || !raw) return null;
        let value;
        try {
          value = JSON.parse(raw);
        } catch {
          return null;
        }
        if (!value || typeof value !== 'object' || Array.isArray(value)) return null;
        const id = typeof value.id === 'string' && value.id ? value.id : null;
        if (!id) return null;
        const label = typeof value.label === 'string' && value.label ? value.label : id;
        return {
          id,
          label,
          url: typeof value.url === 'string' && value.url ? value.url : label,
          ready: value.ready === true,
          // 其余是本页自己的登记细节（本机目录、分支、提交…），宿主不解释
          dir: typeof value.dir === 'string' && value.dir ? value.dir : null,
          branch: typeof value.branch === 'string' ? value.branch : null,
          commit: typeof value.commit === 'string' ? value.commit : null,
          fileCount: typeof value.fileCount === 'number' ? value.fileCount : null,
          bytes: typeof value.bytes === 'number' ? value.bytes : null,
          fetchedAt: typeof value.fetchedAt === 'number' ? value.fetchedAt : null,
        };
      }

      async function load() {
        const rows = await call('data.list', { collection: COLLECTION, limit: 1000 });
        repos = rows.map((row) => parseEntry(row.value)).filter(Boolean);
        selected = repos[0] ? repos[0].id : null;
      }

      /** 读回一行：本机检出目录只登记在这一行里，读回来才知道该更新哪个目录。 */
      async function readEntry(id) {
        return parseEntry(await call('data.get', { collection: COLLECTION, key: id }));
      }

      async function writeEntry(entry) {
        await call('data.put', {
          collection: COLLECTION,
          key: entry.id,
          value: JSON.stringify(entry),
        });
      }

      async function forgetEntry(id) {
        await call('data.delete', { collection: COLLECTION, key: id });
      }

      /**
       * 把一次拉取的结果记进登记表：同一个目录只留最新一条。
       *
       * ready 由「拉取成功」决定——排程只会挑 ready 的材料，所以只有真正落盘的仓库才写 true。
       */
      function remember(url, result) {
        repos = repos.filter((entry) => entry.id !== result.dir);
        const entry = {
          id: result.dir,
          label: url,
          url,
          ready: true,
          dir: result.dir,
          branch: result.branch,
          commit: result.commit,
          fileCount: result.fileCount,
          bytes: result.bytes,
          fetchedAt: Date.now(),
        };
        repos.unshift(entry);
        selected = entry.id;
        return entry;
      }

      function render() {
        const node = document.getElementById('repos');
        node.innerHTML = '';
        for (const entry of repos) {
          const li = document.createElement('li');

          const name = document.createElement('span');
          name.className = entry.id === selected ? 'name selected' : 'name';
          name.textContent = entry.label;
          name.onclick = () => { selected = entry.id; render(); };

          const meta = document.createElement('span');
          meta.className = 'muted';
          if (entry.dir && entry.commit) {
            const when = entry.fetchedAt ? new Date(entry.fetchedAt).toLocaleString() : '';
            meta.textContent =
              `${entry.branch || 'detached'}@${entry.commit.slice(0, 7)} · ${entry.fileCount ?? 0} 文件` +
              (when ? ` · ${when}` : '');
          } else {
            // 迁移过来的登记行还没有本机检出（本机路径不跨设备）：如实写明，按钮不假装能点
            meta.textContent = entry.ready ? '已登记，本机还没有检出' : '尚未就绪';
          }

          const overview = document.createElement('button');
          overview.textContent = '概览';
          overview.disabled = !entry.dir;
          overview.onclick = () => run(() => showOverview(entry));

          const update = document.createElement('button');
          update.textContent = '更新';
          update.onclick = () => run(async () => {
            msg('正在更新…');
            // 同一个目录再拉一次就是更新（宿主侧核对 origin 后才允许）
            const current = await readEntry(entry.id);
            const dir = current?.dir || entry.dir;
            const result = await call('workspace.fetch', dir ? { url: entry.url, dir } : { url: entry.url });
            await writeEntry(remember(entry.url, result));
            msg('已更新到 ' + result.commit.slice(0, 7));
            render();
          });

          const remove = document.createElement('button');
          remove.textContent = '删除';
          remove.onclick = () => run(async () => {
            if (entry.dir) await call('workspace.delete', { path: entry.dir });
            await forgetEntry(entry.id);
            repos = repos.filter((item) => item.id !== entry.id);
            if (selected === entry.id) selected = repos[0] ? repos[0].id : null;
            msg('已删除登记与本机检出');
            render();
          });

          li.append(name, meta, overview, update, remove);
          node.appendChild(li);
        }
      }

      async function run(action) {
        try {
          await action();
        } catch (error) {
          msg(error.message);
        }
      }

      /** 概览：文件数按语言分档 + 符号数。glob 单次上限 200 条，超了就如实写明只看了一部分。 */
      async function showOverview(entry) {
        if (!entry.dir) throw new Error('这个仓库本机还没有检出');
        const out = document.getElementById('overview');
        out.textContent = '正在扫描…';
        const files = await call('workspace.glob', { pattern: entry.dir + '/**/*' });
        const sources = files.filter((path) => SOURCE_EXTENSIONS.test(path));

        const byExtension = {};
        for (const path of sources) {
          const ext = path.slice(path.lastIndexOf('.') + 1).toLowerCase();
          byExtension[ext] = (byExtension[ext] || 0) + 1;
        }
        const languages = Object.entries(byExtension)
          .sort((a, b) => b[1] - a[1])
          .map(([ext, count]) => `${ext}: ${count}`)
          .join('  ');

        let symbolLines = '未提符号（没有可识别的源文件）';
        if (sources.length > 0) {
          const extracted = await call('workspace.symbols', { paths: sources });
          const total = extracted.files.reduce((sum, file) => sum + file.symbols.length, 0);
          const parsed = extracted.files.filter((file) => file.language).length;
          const top = extracted.files
            .flatMap((file) => file.symbols.map((symbol) => symbol.name))
            .slice(0, 12)
            .join('  ');
          symbolLines =
            `符号 ${total} 个（解析 ${parsed}/${sources.length} 个文件` +
            `${extracted.truncated ? '，已到预算上限' : ''}）` +
            (top ? `\n${top}` : '');
        }

        out.textContent =
          `文件 ${files.length} 个${files.length >= 200 ? '（单次上限 200，可能只看到一部分）' : ''}\n` +
          `源码 ${sources.length} 个  ${languages}\n` +
          symbolLines;
      }

      /** 从问题里挑几个标识符去本包工作区里搜，命中片段作为上下文——上下文由包自己拼，宿主不做 */
      async function gatherContext(entry, question) {
        const identifiers = [...new Set(question.match(/[A-Za-z_][A-Za-z0-9_]{2,}/g) || [])].slice(0, 4);
        const lines = [];
        for (const identifier of identifiers) {
          const matches = await call('workspace.grep', { pattern: identifier, path: entry.dir });
          for (const match of matches.slice(0, 5)) {
            lines.push(`${match.path}:${match.line}: ${match.text.trim().slice(0, 200)}`);
          }
          if (lines.length >= 20) break;
        }
        return lines.slice(0, 20);
      }

      document.getElementById('link').onclick = () => run(async () => {
        const url = document.getElementById('url').value.trim();
        if (!url) return;
        msg('正在拉取…');
        const result = await call('workspace.fetch', { url });
        document.getElementById('url').value = '';
        await writeEntry(remember(url, result));
        msg(`已拉到 ${result.dir}（${result.fileCount} 文件）`);
        render();
      });

      document.getElementById('ask').onclick = () => run(async () => {
        const question = document.getElementById('question').value.trim();
        if (!question) return;
        if (!selected) throw new Error('先选中一个仓库再提问');
        const entry = repos.find((item) => item.id === selected);
        if (!entry || !entry.dir) throw new Error('这个仓库本机还没有检出');
        const answer = document.getElementById('answer');
        answer.textContent = '正在检索本包工作区…';
        const context = await gatherContext(entry, question);
        answer.textContent = '';
        const prompt = context.length
          ? `${question}\n\n以下是本包工作区里的相关片段（格式 路径:行号: 内容）：\n${context.join('\n')}`
          : question;
        const started = await call('agent.ask', { question: prompt, role: 'codeAgent', allowTools: false });
        answerStreamId = started.streamId;
      });

      window.addEventListener('message', (event) => {
        const payload = event.data && event.data.openjobEvent;
        if (!payload || payload.streamId !== answerStreamId) return;
        const answer = document.getElementById('answer');
        if (payload.event === 'stream:delta') {
          answer.textContent += payload.delta || '';
        } else if (payload.event === 'stream:done') {
          // 收尾以 contentMd 为准：增量与最终正文可能不完全一致（宿主会做引用剥离等后处理）
          if (payload.contentMd) answer.textContent = payload.contentMd;
          const citations = payload.citations || [];
          if (citations.length > 0) {
            const lines = citations.map((citation) => {
              const where = citation.filePath
                ? `${citation.filePath}${citation.startLine ? ':' + citation.startLine : ''}`
                : citation.title || citation.url || '';
              return `- ${where}${citation.url ? '  ' + citation.url : ''}`.trimEnd();
            });
            answer.textContent += `\n\n来源：\n${lines.join('\n')}`;
          }
        } else if (payload.event === 'stream:error') {
          answer.textContent += `[错误] ${payload.message || ''}`;
        }
      });

      void run(async () => {
        await load();
        render();
      });
    </script>
  </body>
</html>
