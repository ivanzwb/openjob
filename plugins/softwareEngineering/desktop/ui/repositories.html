<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font-family: system-ui, sans-serif; padding: 16px; color: inherit; background: transparent; }
      h2 { font-size: 14px; margin: 14px 0 6px; }
      ul { margin: 0; padding-left: 0; list-style: none; }
      li { margin: 4px 0; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
      .name { font-weight: 600; cursor: pointer; }
      .selected { font-weight: 700; text-decoration: underline; }
      .muted { opacity: 0.65; }
      button { font-size: 12px; }
      input { width: 60%; font-size: 13px; }
      pre { white-space: pre-wrap; }

      /* 代码浏览与查看：只用已有桥原语，无外部依赖、无外部高亮器 */
      .bar { display: flex; gap: 8px; align-items: baseline; margin: 6px 0; font-size: 12px; flex-wrap: wrap; }
      #cwd, #file-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #entries { max-height: 200px; overflow: auto; }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
        font-size: 12px; line-height: 1.5; white-space: pre; overflow: auto;
        max-height: 360px; margin: 0; padding: 8px;
        border: 1px solid rgba(128, 128, 128, 0.25); border-radius: 6px;
      }
      .code .row { display: block; }
      .code .row.hl { background: rgba(255, 193, 7, 0.18); }
      .code .ln {
        display: inline-block; width: 3.5em; text-align: right; padding-right: 0.8em;
        color: rgba(128, 128, 128, 0.75); user-select: none; -webkit-user-select: none;
      }
      /* 内联关键词着色：按语言给一份固定关键词集，未知语言原样退回纯等宽 */
      .tok-kw { color: #7c3aed; font-weight: 600; }
      .tok-str { color: #0a7f3f; }
      .tok-num { color: #b45309; }
      .tok-com { color: #6b7280; font-style: italic; }
      .file-link {
        color: #2563eb; cursor: pointer; text-decoration: underline;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .source { font-size: 12px; margin: 2px 0; }
      @media (prefers-color-scheme: dark) {
        .tok-kw { color: #c792ea; }
        .tok-str { color: #9ece6a; }
        .tok-num { color: #e0af68; }
        .tok-com { color: #8b949e; }
        .file-link { color: #7aa2f7; }
      }
    </style>
  </head>
  <body>
    <h2>仓库</h2>
    <p>
      <input id="url" placeholder="https://github.com/org/repo.git" />
      <button id="link">链接仓库</button>
      <span id="msg" class="muted"></span>
    </p>
    <p class="muted" style="font-size: 12px">
      仓库拉进本包自己的工作区（只放行公开的 https 地址，深度 1、不带凭据）；重复链接同一地址即为更新。
      登记表存在本包声明的 repositories 数据集合里，桌面端是唯一写入方。
    </p>
    <ul id="repos"></ul>

    <h2>代码</h2>
    <p class="muted" style="font-size: 12px">
      从选中的检出逐层浏览目录；点文件名打开带行号的正文，大文件按页读、不整份加载。
      着色只按一份固定关键词表认常见语言，认不出就退回纯等宽。
    </p>
    <div class="bar">
      <button id="up">上级</button>
      <span id="cwd" class="muted">选中仓库后可浏览</span>
    </div>
    <ul id="entries"></ul>
    <div class="bar">
      <span id="file-label" class="muted">未打开文件</span>
      <span id="range" class="muted"></span>
      <button id="prev" disabled>上一页</button>
      <button id="next" disabled>下一页</button>
    </div>
    <pre id="code" class="code">选中仓库后，从上面的列表打开文件。</pre>

    <h2>概览</h2>
    <pre id="overview" class="muted">选中仓库后点「概览」</pre>

    <h2>问源码</h2>
    <p>
      <input id="question" placeholder="选中仓库后提问，如：登录流程在哪实现？" />
      <button id="ask">提问</button>
    </p>
    <pre id="answer" class="muted" style="min-height: 40px"></pre>
    <div id="sources"></div>

    <script>
      // 受控桥：只能调本包声明过的方法（见 desktop/main.ts），未声明的调用落到「未开放的桥方法」。
      // 工作区的路径约束与容量上限判定全在宿主主进程，页面这里只传相对路径。
      function call(method, params) {
        return new Promise((resolve, reject) => {
          const reqId = Date.now() + Math.random();
          const onReply = (event) => {
            const reply = event.data && event.data.openjobResponse;
            if (reply && reply.reqId === reqId) {
              window.removeEventListener('message', onReply);
              reply.error ? reject(new Error(reply.error)) : resolve(reply.result);
            }
          };
          window.addEventListener('message', onReply);
          window.parent.postMessage({ openjob: { reqId, method, params } }, '*');
        });
      }

      // 登记表放在本包 manifest 声明的 repositories 数据集合里：宿主按 (集合, 键) 原样归档与
      // 同步，看不懂内容。行是这里自己序列化的 JSON 字符串，键取仓库 id——排程挑材料时按
      // {id, label, ready} 三个字段读，所以这三个字段必须写对（label 给展示，ready 才行）。
      const COLLECTION = 'repositories';
      const SOURCE_EXTENSIONS = /\.(c|cc|cpp|cs|go|h|hpp|java|js|jsx|kt|php|py|rb|rs|scala|swift|ts|tsx|vue)$/i;

      // 一页读多少行：大文件翻页看，不整份塞进页面。宿主单次读有字节上限，超了如实报错。
      const PAGE_LINES = 300;
      const CODE_HINT = '选中仓库后，从上面的列表打开文件。';

      let repos = [];
      let selected = null;
      let answerStreamId = null;

      // 代码浏览与查看的页面状态
      let browseDir = null;      // 当前浏览目录（工作区相对路径）
      let openPath = null;       // 当前打开的文件（工作区相对路径）
      let pageOffset = 1;        // 当前页起始行（1 起）
      let pageHasMore = false;
      let highlightFrom = null;  // 从引用跳转时高亮的行区间
      let highlightTo = null;

      const msg = (text) => { document.getElementById('msg').textContent = text; };

      /** 行是包自己的 JSON，宿主不理解：解析不出、没有 id 的行一律跳过。 */
      function parseEntry(raw) {
        if (typeof raw !== 'string' || !raw) return null;
        let value;
        try {
          value = JSON.parse(raw);
        } catch {
          return null;
        }
        if (!value || typeof value !== 'object' || Array.isArray(value)) return null;
        const id = typeof value.id === 'string' && value.id ? value.id : null;
        if (!id) return null;
        const label = typeof value.label === 'string' && value.label ? value.label : id;
        return {
          id,
          label,
          url: typeof value.url === 'string' && value.url ? value.url : label,
          ready: value.ready === true,
          // 其余是本页自己的登记细节（本机目录、分支、提交…），宿主不解释
          dir: typeof value.dir === 'string' && value.dir ? value.dir : null,
          branch: typeof value.branch === 'string' ? value.branch : null,
          commit: typeof value.commit === 'string' ? value.commit : null,
          fileCount: typeof value.fileCount === 'number' ? value.fileCount : null,
          bytes: typeof value.bytes === 'number' ? value.bytes : null,
          fetchedAt: typeof value.fetchedAt === 'number' ? value.fetchedAt : null,
        };
      }

      async function load() {
        const rows = await call('data.list', { collection: COLLECTION, limit: 1000 });
        repos = rows.map((row) => parseEntry(row.value)).filter(Boolean);
        selected = repos[0] ? repos[0].id : null;
      }

      /** 读回一行：本机检出目录只登记在这一行里，读回来才知道该更新哪个目录。 */
      async function readEntry(id) {
        return parseEntry(await call('data.get', { collection: COLLECTION, key: id }));
      }

      async function writeEntry(entry) {
        await call('data.put', {
          collection: COLLECTION,
          key: entry.id,
          value: JSON.stringify(entry),
        });
      }

      async function forgetEntry(id) {
        await call('data.delete', { collection: COLLECTION, key: id });
      }

      /**
       * 把一次拉取的结果记进登记表：同一个目录只留最新一条。
       *
       * ready 由「拉取成功」决定——排程只会挑 ready 的材料，所以只有真正落盘的仓库才写 true。
       */
      function remember(url, result) {
        repos = repos.filter((entry) => entry.id !== result.dir);
        const entry = {
          id: result.dir,
          label: url,
          url,
          ready: true,
          dir: result.dir,
          branch: result.branch,
          commit: result.commit,
          fileCount: result.fileCount,
          bytes: result.bytes,
          fetchedAt: Date.now(),
        };
        repos.unshift(entry);
        selected = entry.id;
        return entry;
      }

      function currentRepo() {
        return repos.find((item) => item.id === selected) || null;
      }

      function formatSize(bytes) {
        if (typeof bytes !== 'number') return '';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      }

      // ── 内联着色：一份固定关键词表 + 一份按扩展名的语言映射 ──────────────────
      // 只认关键词 / 字符串 / 数字 / 行注释，认不出的语言原样退回纯等宽。刻意不做解析器。
      function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      const KEYWORDS = {
        js: 'async await break case catch class const continue debugger default delete do else export extends finally for from function get if import in instanceof let new of return set static super switch this throw try typeof var void while yield'.split(' '),
        py: 'and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield True False None self'.split(' '),
        go: 'break case chan const continue default defer else fallthrough for func go goto if import interface map package range return select struct switch type var true false nil'.split(' '),
        rs: 'as async await break const continue crate dyn else enum extern false fn for if impl in let loop match mod move mut pub ref return self static struct super trait true type unsafe use where while'.split(' '),
        java: 'abstract assert boolean break byte case catch char class const continue default do double else enum extends final finally float for if implements import instanceof int interface long native new package private protected public return short static super switch synchronized this throw throws transient try void volatile while true false null'.split(' '),
        c: 'auto break case char const continue default do double else enum extern float for goto if inline int long register restrict return short signed sizeof static struct switch typedef union unsigned void volatile while'.split(' '),
        cpp: 'auto break case catch char class const constexpr continue default delete do double else enum explicit export extern float for friend if inline int long namespace new operator private protected public return short signed sizeof static struct switch template this throw try typedef typename union unsigned using virtual void volatile while true false nullptr'.split(' '),
        cs: 'abstract as base break case catch class const continue default do double else enum event explicit extern false finally fixed float for foreach if in int interface internal is lock long namespace new null object out override private protected public readonly ref return sealed short sizeof static string struct switch this throw true try typeof uint ulong using var virtual void while'.split(' '),
        rb: 'alias and begin break case class def defined do else elsif end ensure false for if in module next nil not or redo rescue retry return self super then true undef unless until when while yield'.split(' '),
        php: 'abstract and array as break callable case catch class clone const continue declare default do echo else elseif enddeclare endfor endforeach endif endswitch endwhile extends final finally fn for foreach function global goto if implements instanceof interface isset list namespace new or print private protected public require require_once return static switch throw trait try unset use var while xor yield true false null'.split(' '),
        sh: 'case do done elif else esac fi for function if in select then time until while'.split(' '),
        sql: 'select from where insert into values update set delete create table alter drop join left right inner outer on group by order having limit offset distinct as and or not null is like in between union all exists primary key foreign references default'.split(' '),
        kotlin: 'as break class continue do else false for fun if in interface is null object package return super this throw true try typealias val var when while by catch constructor delegate dynamic field finally get import init param property receiver set setparam where actual abstract annotation companion const crossinline data enum expect external final infix inline inner internal lateinit noinline open operator out override private protected public reified sealed suspend tailrec vararg'.split(' '),
        swift: 'associatedtype class deinit enum extension fileprivate func import init inout internal let open operator private protocol public static struct subscript typealias var break case continue default defer do else fallthrough for guard if in repeat return switch where while as any catch false is nil rethrows super self throw throws true try'.split(' '),
        scala: 'abstract case catch class def do else extends false final finally for forSome if implicit import lazy match new null object override package private protected return sealed super this throw trait try true type val var while with yield'.split(' '),
      };

      const EXT_LANG = {
        js: 'js', mjs: 'js', cjs: 'js', jsx: 'js', ts: 'js', tsx: 'js', mts: 'js', cts: 'js', vue: 'js',
        py: 'py', pyw: 'py',
        go: 'go', rs: 'rs', java: 'java',
        c: 'c', h: 'c',
        cc: 'cpp', cpp: 'cpp', cxx: 'cpp', hpp: 'cpp', hh: 'cpp', cs: 'cs',
        rb: 'rb', php: 'php', sh: 'sh', bash: 'sh', zsh: 'sh', sql: 'sql',
        kt: 'kotlin', kts: 'kotlin', swift: 'swift', scala: 'scala',
      };

      // `#` 是注释的语言（用另一条 token 正则）；其余走 `//`
      const HASH_COMMENT = { py: true, rb: true, sh: true };

      const TOKENS_SLASH = /\/\/[^\n]*|\/\*.*?\*\/|'(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|`(?:\\.|[^`\\])*`|\b\d[\w.]*\b|[A-Za-z_$][\w$]*/g;
      const TOKENS_HASH = /#[^\n]*|\/\*.*?\*\/|'(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|`(?:\\.|[^`\\])*`|\b\d[\w.]*\b|[A-Za-z_$][\w$]*/g;

      const KEYWORD_SETS = {};
      function keywordSet(lang) {
        if (!KEYWORD_SETS[lang]) KEYWORD_SETS[lang] = new Set(KEYWORDS[lang] || []);
        return KEYWORD_SETS[lang];
      }

      function langForKey(path) {
        const dot = path.lastIndexOf('.');
        if (dot === -1) return null;
        return EXT_LANG[path.slice(dot + 1).toLowerCase()] || null;
      }

      function colorize(line, lang) {
        if (!lang || !KEYWORDS[lang]) return escapeHtml(line);
        const keywords = keywordSet(lang);
        const re = HASH_COMMENT[lang] ? TOKENS_HASH : TOKENS_SLASH;
        re.lastIndex = 0;
        let out = '';
        let last = 0;
        let match;
        while ((match = re.exec(line)) !== null) {
          out += escapeHtml(line.slice(last, match.index));
          const token = match[0];
          let cls = '';
          if (token.startsWith('//') || token.startsWith('/*') || token.startsWith('#')) cls = 'tok-com';
          else if (token[0] === "'" || token[0] === '"' || token[0] === '`') cls = 'tok-str';
          else if (token.charCodeAt(0) >= 48 && token.charCodeAt(0) <= 57) cls = 'tok-num';
          else if (keywords.has(token)) cls = 'tok-kw';
          out += cls ? `<span class="${cls}">${escapeHtml(token)}</span>` : escapeHtml(token);
          last = match.index + token.length;
        }
        return out + escapeHtml(line.slice(last));
      }

      // ── 浏览：从选中检出的目录逐层列出 ────────────────────────────────────
      function setBrowseEmpty(text) {
        browseDir = null;
        document.getElementById('cwd').textContent = text;
        document.getElementById('up').disabled = true;
        document.getElementById('entries').innerHTML = '';
      }

      async function showDir(dir) {
        const entries = await call('workspace.list', { path: dir });
        browseDir = dir;
        const repo = currentRepo();
        document.getElementById('cwd').textContent = dir === '.' ? './' : dir + '/';
        // 不越出选中的检出：到了仓库根就没有「上级」
        document.getElementById('up').disabled = !repo || dir === repo.dir;
        renderEntries(entries);
      }

      function renderEntries(entries) {
        const node = document.getElementById('entries');
        node.innerHTML = '';
        const sorted = [...entries].sort((left, right) => {
          if (left.type !== right.type) return left.type === 'dir' ? -1 : 1;
          return left.path < right.path ? -1 : left.path > right.path ? 1 : 0;
        });
        for (const entry of sorted) {
          const li = document.createElement('li');
          const base = entry.path.slice(entry.path.lastIndexOf('/') + 1);

          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = entry.type === 'dir' ? base + '/' : base;
          name.onclick = () => run(() =>
            entry.type === 'dir' ? showDir(entry.path) : openFile(entry.path),
          );

          const meta = document.createElement('span');
          meta.className = 'muted';
          meta.textContent = entry.type === 'dir' ? '' : formatSize(entry.size);

          li.append(name, meta);
          node.appendChild(li);
        }
        if (sorted.length === 0) {
          const li = document.createElement('li');
          li.className = 'muted';
          li.textContent = '（空目录）';
          node.appendChild(li);
        }
      }

      /** 从选中仓库重新初始化浏览位置，并清掉当前打开的文件。 */
      async function refreshBrowse() {
        resetViewer();
        const repo = currentRepo();
        if (repo && repo.dir) await showDir(repo.dir);
        else setBrowseEmpty('选中仓库后可浏览');
      }

      // ── 查看：按行区间读取、带行号、翻页 ───────────────────────────────────
      function resetViewer() {
        openPath = null;
        pageOffset = 1;
        pageHasMore = false;
        highlightFrom = null;
        highlightTo = null;
        document.getElementById('code').textContent = CODE_HINT;
        document.getElementById('file-label').textContent = '未打开文件';
        document.getElementById('range').textContent = '';
        document.getElementById('prev').disabled = true;
        document.getElementById('next').disabled = true;
      }

      /** 读一页；多读一行用来判断后面还有没有内容。找不到文件时抛出，交给调用方换候选。 */
      async function readRange(path, offset) {
        const text = await call('workspace.read', {
          path,
          startLine: offset,
          endLine: offset + PAGE_LINES,
        });
        const all = String(text === undefined || text === null ? '' : text).split('\n');
        const hasMore = all.length > PAGE_LINES;
        return { lines: hasMore ? all.slice(0, PAGE_LINES) : all, hasMore };
      }

      function renderLines(lines, start) {
        const lang = openPath ? langForKey(openPath) : null;
        const rows = lines.map((line, index) => {
          const number = start + index;
          const marked =
            highlightFrom !== null &&
            number >= highlightFrom &&
            (highlightTo === null || number <= highlightTo);
          return (
            `<div class="row${marked ? ' hl' : ''}">` +
            `<span class="ln">${number}</span>` +
            `<span class="txt">${colorize(line, lang)}</span>` +
            '</div>'
          );
        });
        document.getElementById('code').innerHTML = rows.join('');
      }

      function updateViewerChrome(lines, path) {
        document.getElementById('file-label').textContent = path;
        const count = lines.length;
        const end = count > 0 ? pageOffset + count - 1 : pageOffset;
        document.getElementById('range').textContent = count > 0 ? `第 ${pageOffset}–${end} 行` : '';
        document.getElementById('prev').disabled = pageOffset <= 1;
        document.getElementById('next').disabled = !pageHasMore;
      }

      function dirOf(path) {
        const cut = path.lastIndexOf('/');
        if (cut === -1) return (currentRepo() || {}).dir || '.';
        return path.slice(0, cut);
      }

      /** 打开文件时把浏览列表跟到它所在的目录；失败不影响正文。 */
      async function syncBrowseTo(path) {
        try {
          await showDir(dirOf(path));
        } catch {
          // 浏览位置同步失败不必打断查看
        }
      }

      async function openFile(path, startLine, endLine) {
        // 从引用跳转时把目标行往上留一点，别让它正好压在第一行
        const offset = startLine && startLine > 1 ? Math.max(1, startLine - 3) : 1;
        const page = await readRange(path, offset);
        openPath = path;
        pageOffset = offset;
        pageHasMore = page.hasMore;
        highlightFrom = startLine || null;
        highlightTo = endLine || startLine || null;
        renderLines(page.lines, offset);
        updateViewerChrome(page.lines, path);
        await syncBrowseTo(path);
      }

      async function gotoPage(offset) {
        if (!openPath) return;
        const page = await readRange(openPath, offset);
        pageOffset = offset;
        pageHasMore = page.hasMore;
        highlightFrom = null;
        highlightTo = null;
        renderLines(page.lines, offset);
        updateViewerChrome(page.lines, openPath);
      }

      function render() {
        const node = document.getElementById('repos');
        node.innerHTML = '';
        for (const entry of repos) {
          const li = document.createElement('li');

          const name = document.createElement('span');
          name.className = entry.id === selected ? 'name selected' : 'name';
          name.textContent = entry.label;
          name.onclick = () => run(async () => {
            selected = entry.id;
            render();
            resetViewer();
            if (entry.dir) await showDir(entry.dir);
            else setBrowseEmpty('这个仓库本机还没有检出');
          });

          const meta = document.createElement('span');
          meta.className = 'muted';
          if (entry.dir && entry.commit) {
            const when = entry.fetchedAt ? new Date(entry.fetchedAt).toLocaleString() : '';
            meta.textContent =
              `${entry.branch || 'detached'}@${entry.commit.slice(0, 7)} · ${entry.fileCount ?? 0} 文件` +
              (when ? ` · ${when}` : '');
          } else {
            // 迁移过来的登记行还没有本机检出（本机路径不跨设备）：如实写明，按钮不假装能点
            meta.textContent = entry.ready ? '已登记，本机还没有检出' : '尚未就绪';
          }

          const overview = document.createElement('button');
          overview.textContent = '概览';
          overview.disabled = !entry.dir;
          overview.onclick = () => run(() => showOverview(entry));

          const update = document.createElement('button');
          update.textContent = '更新';
          update.onclick = () => run(async () => {
            msg('正在更新…');
            // 同一个目录再拉一次就是更新（宿主侧核对 origin 后才允许）
            const current = await readEntry(entry.id);
            const dir = current?.dir || entry.dir;
            const result = await call('workspace.fetch', dir ? { url: entry.url, dir } : { url: entry.url });
            await writeEntry(remember(entry.url, result));
            msg('已更新到 ' + result.commit.slice(0, 7));
            render();
          });

          const remove = document.createElement('button');
          remove.textContent = '删除';
          remove.onclick = () => run(async () => {
            if (entry.dir) await call('workspace.delete', { path: entry.dir });
            await forgetEntry(entry.id);
            repos = repos.filter((item) => item.id !== entry.id);
            if (selected === entry.id) selected = repos[0] ? repos[0].id : null;
            msg('已删除登记与本机检出');
            render();
            await refreshBrowse();
          });

          li.append(name, meta, overview, update, remove);
          node.appendChild(li);
        }
      }

      async function run(action) {
        try {
          await action();
        } catch (error) {
          msg(error.message);
        }
      }

      /** 概览：文件数按语言分档 + 符号数。glob 单次上限 200 条，超了就如实写明只看了一部分。 */
      async function showOverview(entry) {
        if (!entry.dir) throw new Error('这个仓库本机还没有检出');
        const out = document.getElementById('overview');
        out.textContent = '正在扫描…';
        const files = await call('workspace.glob', { pattern: entry.dir + '/**/*' });
        const sources = files.filter((path) => SOURCE_EXTENSIONS.test(path));

        const byExtension = {};
        for (const path of sources) {
          const ext = path.slice(path.lastIndexOf('.') + 1).toLowerCase();
          byExtension[ext] = (byExtension[ext] || 0) + 1;
        }
        const languages = Object.entries(byExtension)
          .sort((a, b) => b[1] - a[1])
          .map(([ext, count]) => `${ext}: ${count}`)
          .join('  ');

        let symbolLines = '未提符号（没有可识别的源文件）';
        if (sources.length > 0) {
          const extracted = await call('workspace.symbols', { paths: sources });
          const total = extracted.files.reduce((sum, file) => sum + file.symbols.length, 0);
          const parsed = extracted.files.filter((file) => file.language).length;
          const top = extracted.files
            .flatMap((file) => file.symbols.map((symbol) => symbol.name))
            .slice(0, 12)
            .join('  ');
          symbolLines =
            `符号 ${total} 个（解析 ${parsed}/${sources.length} 个文件` +
            `${extracted.truncated ? '，已到预算上限' : ''}）` +
            (top ? `\n${top}` : '');
        }

        out.textContent =
          `文件 ${files.length} 个${files.length >= 200 ? '（单次上限 200，可能只看到一部分）' : ''}\n` +
          `源码 ${sources.length} 个  ${languages}\n` +
          symbolLines;
      }

      /** 从问题里挑几个标识符去本包工作区里搜，命中片段作为上下文——上下文由包自己拼，宿主不做 */
      async function gatherContext(entry, question) {
        const identifiers = [...new Set(question.match(/[A-Za-z_][A-Za-z0-9_]{2,}/g) || [])].slice(0, 4);
        const lines = [];
        for (const identifier of identifiers) {
          const matches = await call('workspace.grep', { pattern: identifier, path: entry.dir });
          for (const match of matches.slice(0, 5)) {
            lines.push(`${match.path}:${match.line}: ${match.text.trim().slice(0, 200)}`);
          }
          if (lines.length >= 20) break;
        }
        return lines.slice(0, 20);
      }

      // ── 引用跳转：带文件（可有行号）的引用点一下就在查看器里打开 ─────────────
      /** 引用里的路径可能是工作区相对，也可能只是检出内的相对；两种都试一遍。 */
      function citationCandidates(filePath) {
        const cleaned = String(filePath).replace(/^\.\//, '').replace(/^\/+/, '');
        const list = [cleaned];
        const repo = currentRepo();
        if (repo && repo.dir && repo.dir !== '.' && !(cleaned === repo.dir || cleaned.startsWith(repo.dir + '/'))) {
          list.push(repo.dir + '/' + cleaned);
        }
        return list;
      }

      async function openFromCitation(filePath, startLine, endLine) {
        let lastError = null;
        for (const candidate of citationCandidates(filePath)) {
          try {
            await openFile(candidate, startLine, endLine);
            return;
          } catch (error) {
            lastError = error;
          }
        }
        throw lastError || new Error(`打不开引用里的文件：${filePath}`);
      }

      function renderSources(citations) {
        const node = document.getElementById('sources');
        node.innerHTML = '';
        if (!citations.length) return;

        const title = document.createElement('div');
        title.className = 'muted';
        title.textContent = '来源：';
        node.appendChild(title);

        for (const citation of citations) {
          const row = document.createElement('div');
          if (citation.filePath) {
            // 有文件：路径可点，点开跳到那个文件 / 行
            row.className = 'source';
            row.appendChild(document.createTextNode('- '));
            const link = document.createElement('span');
            link.className = 'file-link';
            link.textContent = citation.filePath + (citation.startLine ? ':' + citation.startLine : '');
            link.title = '在代码查看器里打开';
            link.onclick = () =>
              run(() => openFromCitation(citation.filePath, citation.startLine, citation.endLine));
            row.appendChild(link);
            if (citation.url) {
              const url = document.createElement('span');
              url.className = 'muted';
              url.textContent = '  ' + citation.url;
              row.appendChild(url);
            }
          } else {
            // 没有文件的引用照旧：只是一行文字，不假装能点
            row.className = 'source muted';
            const where = citation.title || citation.url || '';
            row.textContent = ('- ' + where + (citation.url ? '  ' + citation.url : '')).trimEnd();
          }
          node.appendChild(row);
        }
      }

      document.getElementById('up').onclick = () => run(async () => {
        const repo = currentRepo();
        if (!browseDir || !repo || !repo.dir || browseDir === repo.dir) return;
        const cut = browseDir.lastIndexOf('/');
        const parent = cut === -1 ? repo.dir : browseDir.slice(0, cut);
        await showDir(parent);
      });

      document.getElementById('prev').onclick = () => run(() => gotoPage(Math.max(1, pageOffset - PAGE_LINES)));
      document.getElementById('next').onclick = () => run(() => gotoPage(pageOffset + PAGE_LINES));

      document.getElementById('link').onclick = () => run(async () => {
        const url = document.getElementById('url').value.trim();
        if (!url) return;
        msg('正在拉取…');
        const result = await call('workspace.fetch', { url });
        document.getElementById('url').value = '';
        await writeEntry(remember(url, result));
        msg(`已拉到 ${result.dir}（${result.fileCount} 文件）`);
        render();
        resetViewer();
        await showDir(result.dir);
      });

      document.getElementById('ask').onclick = () => run(async () => {
        const question = document.getElementById('question').value.trim();
        if (!question) return;
        if (!selected) throw new Error('先选中一个仓库再提问');
        const entry = repos.find((item) => item.id === selected);
        if (!entry || !entry.dir) throw new Error('这个仓库本机还没有检出');
        const answer = document.getElementById('answer');
        document.getElementById('sources').innerHTML = '';
        answer.textContent = '正在检索本包工作区…';
        const context = await gatherContext(entry, question);
        answer.textContent = '';
        const prompt = context.length
          ? `${question}\n\n以下是本包工作区里的相关片段（格式 路径:行号: 内容）：\n${context.join('\n')}`
          : question;
        const started = await call('agent.ask', { question: prompt, role: 'codeAgent', allowTools: false });
        answerStreamId = started.streamId;
      });

      window.addEventListener('message', (event) => {
        const payload = event.data && event.data.openjobEvent;
        if (!payload || payload.streamId !== answerStreamId) return;
        const answer = document.getElementById('answer');
        if (payload.event === 'stream:delta') {
          answer.textContent += payload.delta || '';
        } else if (payload.event === 'stream:done') {
          // 收尾以 contentMd 为准：增量与最终正文可能不完全一致（宿主会做引用剥离等后处理）
          if (payload.contentMd) answer.textContent = payload.contentMd;
          renderSources(payload.citations || []);
        } else if (payload.event === 'stream:error') {
          answer.textContent += `[错误] ${payload.message || ''}`;
        }
      });

      void run(async () => {
        await load();
        render();
        await refreshBrowse();
      });
    </script>
  </body>
</html>
